name: spike-typephp

on:
  workflow_dispatch:

jobs:
  spike:
    name: spike
    runs-on: ubuntu-latest
    env:
      TPC_VERSION: v0.7.0
      TPC_ASSET: tpc_v0.7.0_linux_x64.tar.gz
      TPC_URL: https://github.com/swoole/typephp/releases/download/v0.7.0/tpc_v0.7.0_linux_x64.tar.gz
      TPC_DIST: /tmp/typephp-dist
      SPIKE_DIR: /tmp/typephp-spike
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx
      TYPEPHP_REF: v0.7.0
      TYPEPHP_PATCH_URL: https://raw.githubusercontent.com/swoole/typephp/v0.7.0/.github/patches/php-hash-cxx.patch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Spike Output Directory
        run: mkdir -p "$SPIKE_DIR"

      - name: Setup PHP 8.5 (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          phpts: ts

      - name: Verify PHP ZTS (first attempt)
        id: zts_attempt1
        continue-on-error: true
        run: |
          {
            php -v
            echo '--- php -i | grep -i thread ---'
            php -i | grep -i thread || true
            echo "PHP_ZTS=$(php -r 'echo PHP_ZTS;')"
          } > "$SPIKE_DIR/php-zts-attempt1.txt" 2>&1
          cat "$SPIKE_DIR/php-zts-attempt1.txt"
          test "$(php -r 'echo PHP_ZTS;')" = "1"

      - name: Retry Setup PHP 8.5 (ZTS) with update:true (only when NTS detected)
        if: steps.zts_attempt1.outcome == 'failure'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          phpts: ts
          update: true

      - name: Verify PHP ZTS (final, must pass)
        run: |
          {
            php -v
            echo '--- php -i | grep -i thread ---'
            php -i | grep -i thread || true
            echo "PHP_ZTS=$(php -r 'echo PHP_ZTS;')"
          } > "$SPIKE_DIR/php-zts.txt" 2>&1
          cat "$SPIKE_DIR/php-zts.txt"
          if [ "$(php -r 'echo PHP_ZTS;')" != "1" ]; then
            echo "::error::PHP is NTS, ZTS build is required for typephp tpc"
            exit 1
          fi
          echo 'ZTS confirmed'

      - name: Install System Dependencies (official typephp CI list + cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev
          {
            echo '--- dpkg package versions ---'
            for pkg in build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev; do
              dpkg -s "$pkg" 2>/dev/null | grep -E '^(Package|Version)' || true
            done
            echo '--- cmake --version ---'
            cmake --version | head -n1
          } > "$SPIKE_DIR/system-deps.txt" 2>&1
          cat "$SPIKE_DIR/system-deps.txt"

      - name: Check cmake >= 3.24
        run: |
          CMAKE_VER="$(cmake --version | head -n1 | awk '{print $3}')"
          OLDEST_OK="$(printf '%s\n3.24\n' "$CMAKE_VER" | sort -V | head -n1)"
          echo "cmake version: $CMAKE_VER (oldest allowed: 3.24)"
          if [ "$OLDEST_OK" != "3.24" ]; then
            echo "::error::cmake >= 3.24 required, got $CMAKE_VER"
            exit 1
          fi
          echo "cmake $CMAKE_VER >= 3.24 OK"

      - name: Download and Extract tpc (linux-x64 release)
        run: |
          mkdir -p "$TPC_DIST"
          cd "$TPC_DIST"
          echo "Downloading $TPC_URL"
          curl -fsSL -o "$TPC_ASSET" "$TPC_URL"
          curl -fsSL -o SHA256SUMS "https://github.com/swoole/typephp/releases/download/${TPC_VERSION}/SHA256SUMS"
          grep "$TPC_ASSET" SHA256SUMS | sha256sum -c -
          tar -xzf "$TPC_ASSET"
          {
            echo "TPC_VERSION=$TPC_VERSION"
            echo "TPC_URL=$TPC_URL"
            echo '--- extracted files ---'
            find . -not -path './.*' | sort
          } > "$SPIKE_DIR/tpc-download.txt" 2>&1
          cat "$SPIKE_DIR/tpc-download.txt"

      - name: Inspect tpc Dynamic Library Requirements (before provisioning)
        run: |
          TPC_BIN="$(find "$TPC_DIST" -type f -name tpc | head -n1)"
          echo "tpc binary: $TPC_BIN"
          ldd "$TPC_BIN" > "$SPIKE_DIR/tpc-ldd-before.txt" 2>&1 || true
          cat "$SPIKE_DIR/tpc-ldd-before.txt"

      # --- libphp.so + libphpx.so provisioning (mirrors official typephp CI) ---

      - name: Download php_hash.h C++ Compatibility Patch (typephp v0.7.0)
        run: |
          curl -fsSL -o "$SPIKE_DIR/php-hash-cxx.patch" "$TYPEPHP_PATCH_URL"
          head -5 "$SPIKE_DIR/php-hash-cxx.patch"

      - name: Patch php_hash.h C++ Compatibility (official typephp workaround)
        run: |
          php_include_dir="$(php-config --include-dir)"
          php_hash_header="${php_include_dir}/ext/hash/php_hash.h"
          if grep -Fq 'char *base = ecalloc(' "${php_hash_header}"; then
            sudo patch --directory="${php_include_dir}" --strip=1 < "$SPIKE_DIR/php-hash-cxx.patch"
            echo 'php_hash.h patched for C++ compatibility'
          else
            echo 'php_hash.h already contains the upstream C++ fix'
          fi

      - name: Configure ZTS PHP Embed Library (PHP_HOME from setup-php)
        run: |
          php_home="$(php-config --prefix)"
          embed_library="${php_home}/lib/libphp.so"
          test -x "${php_home}/bin/php-config"
          test -f "${embed_library}"
          echo "PHP_HOME=${php_home}" >> "${GITHUB_ENV}"
          {
            echo "PHP_HOME=${php_home}"
            echo "embed library: ${embed_library}"
            php-config --version
          } | tee "$SPIKE_DIR/php-home.txt"

      - name: Checkout PHPX (swoole/phpx, official typephp CI uses master)
        uses: actions/checkout@v4
        with:
          repository: swoole/phpx
          ref: master
          path: third_party/phpx

      - name: Build libphpx.so (official typephp CI cmake invocation)
        run: |
          set -o pipefail
          cmake -S "$PHPX_HOME" -B "$PHPX_HOME/build" \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D BUILD_EXT=OFF \
            -D GITHUB_ACTION=ON \
            -D php_dir="${PHP_HOME}" \
            | tee "$SPIKE_DIR/phpx-cmake-configure.txt"
          cmake --build "$PHPX_HOME/build" --target phpx --parallel 2 \
            | tee "$SPIKE_DIR/phpx-cmake-build.txt"
          test -f "${PHPX_HOME}/lib/libphpx.so"
          {
            echo "libphpx.so: ${PHPX_HOME}/lib/libphpx.so"
            ls -la "${PHPX_HOME}/lib/"
          } | tee "$SPIKE_DIR/phpx-build-result.txt"

      - name: Configure Native Library Path (LD_LIBRARY_PATH)
        run: |
          echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib"

      - name: Inspect tpc Dynamic Library Requirements (after provisioning)
        run: |
          TPC_BIN="$(find "$TPC_DIST" -type f -name tpc | head -n1)"
          ldd "$TPC_BIN" > "$SPIKE_DIR/tpc-ldd-after.txt" 2>&1 || true
          cat "$SPIKE_DIR/tpc-ldd-after.txt"
          if grep -q 'not found' "$SPIKE_DIR/tpc-ldd-after.txt"; then
            echo '::error::tpc still has unresolved dynamic libraries'
          else
            echo 'all shared library dependencies resolved'
          fi

      - name: Run tpc --help
        id: tpc_help
        continue-on-error: true
        run: |
          TPC_BIN="$(find "$TPC_DIST" -type f -name tpc | head -n1)"
          chmod +x "$TPC_BIN" || true
          set +e
          "$TPC_BIN" --help > "$SPIKE_DIR/tpc-help.txt" 2>&1
          TPC_EXIT=$?
          set -e
          cat "$SPIKE_DIR/tpc-help.txt"
          echo "tpc --help exit code: $TPC_EXIT" > "$SPIKE_DIR/tpc-help-exit-code.txt"
          cat "$SPIKE_DIR/tpc-help-exit-code.txt"

      - name: Assert tpc --help Exit Code 0
        run: |
          if [ ! -f "$SPIKE_DIR/tpc-help-exit-code.txt" ]; then
            echo '::error::tpc --help exit code file missing (tpc --help step did not run)'
            exit 1
          fi
          exit_code="$(sed 's/.*: //' "$SPIKE_DIR/tpc-help-exit-code.txt")"
          echo "tpc --help exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "::error::tpc --help exited with code $exit_code (T0.1 acceptance requires 0)"
            exit 1
          fi
          echo 'T0.1 acceptance: tpc --help exit code 0 OK'

      - name: Spike Compile src/ (tpc --dry, collect error list)
        continue-on-error: true
        run: |
          TPC_BIN="$(find "$TPC_DIST" -type f -name tpc | head -n1)"
          set -o pipefail
          set +e
          "$TPC_BIN" spike-tmp/project.yml --dry --build-dir build/spike 2>&1 \
            | tee "$SPIKE_DIR/tpc-dry-compile.txt"
          TPC_DRY_EXIT=$?
          set -e
          echo "tpc --dry exit code: $TPC_DRY_EXIT" > "$SPIKE_DIR/tpc-dry-exit-code.txt"
          cat "$SPIKE_DIR/tpc-dry-exit-code.txt"

      - name: Spike Compile src/ (list dry build artifacts)
        if: always()
        run: |
          {
            echo '--- dry build dir candidates (build/spike, spike-tmp/build/spike) ---'
            find build/spike spike-tmp/build/spike -maxdepth 2 2>/dev/null | sort | head -100 || true
            echo '--- tpc --dry exit code ---'
            cat "$SPIKE_DIR/tpc-dry-exit-code.txt" 2>/dev/null || echo 'not captured'
          } > "$SPIKE_DIR/tpc-dry-build-dir.txt" 2>&1
          cat "$SPIKE_DIR/tpc-dry-build-dir.txt"

      - name: Spike Summary
        if: always()
        run: |
          {
            echo '=== spike-typephp summary ==='
            echo "TPC_VERSION=$TPC_VERSION"
            echo "TPC_URL=$TPC_URL"
            echo "PHP_HOME=${PHP_HOME:-not set}"
            echo "PHPX_HOME=${PHPX_HOME:-not set}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-not set}"
            cat "$SPIKE_DIR/tpc-help-exit-code.txt" 2>/dev/null || echo 'tpc --help exit code: not captured'
            if grep -q 'not found' "$SPIKE_DIR/tpc-ldd-after.txt" 2>/dev/null; then
              echo 'ldd-after: UNRESOLVED libraries present'
            else
              echo 'ldd-after: all resolved'
            fi
          } > "$SPIKE_DIR/spike-summary.txt" 2>&1
          cat "$SPIKE_DIR/spike-summary.txt"

      - name: Upload Spike Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-typephp-evidence
          path: ${{ env.SPIKE_DIR }}/
          if-no-files-found: error
